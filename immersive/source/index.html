    const mat = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide });
    if (opacity !== undefined) { mat.transparent = true; mat.opacity = opacity; mat.depthWrite = false; }
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    m.position.set(x, y, z);
    parent.object3D.add(m);
    return m;
  }

  function lines(parent, points, color, dashed) {
    const g = new THREE.BufferGeometry().setFromPoints(points);
    const mat = dashed ? new THREE.LineDashedMaterial({ color: color, dashSize: 0.02, gapSize: 0.014 })
                       : new THREE.LineBasicMaterial({ color: color });
    const l = new THREE.LineSegments(g, mat);
    if (dashed) l.computeLineDistances();
    parent.object3D.add(l);
    return l;
  }

  // marks: [{x, y, z, r, color}] drawn as one instanced mesh of opaque discs (or, with ball, shaded spheres).
  const DISC = new THREE.CircleGeometry(1, 24), BALL = new THREE.SphereGeometry(1, 14, 10);
  function discs(parent, items, ball) {
    if (!items.length) return null;
    const mesh = new THREE.InstancedMesh(ball ? BALL : DISC, ball ? new THREE.MeshLambertMaterial() : new THREE.MeshBasicMaterial(), items.length);
    const o = new THREE.Object3D();
    const c = new THREE.Color();
    items.forEach(function (it, i) {
      o.position.set(it.x, it.y, it.z);
      o.scale.setScalar(it.r);
      o.updateMatrix();
      mesh.setMatrixAt(i, o.matrix);
      mesh.setColorAt(i, c.set(it.color));
    });
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    mesh.frustumCulled = false;
    parent.object3D.add(mesh);
    return mesh;
  }

  function ring(parent, x, y, z, inner, outer, color) {
    const m = new THREE.Mesh(new THREE.RingGeometry(inner, outer, 48), new THREE.MeshBasicMaterial({ color: color }));
    m.position.set(x, y, z);
    parent.object3D.add(m);
    return m;
  }

  // The dashboard's M7+ symbol: a dot in its depth colour, with one ring round it.
  function m7Symbol(parent, x, y, z, r, color) {
    return [discs(parent, [{ x: x, y: y, z: z, r: r, color: color }]),
            ring(parent, x, y, z + 0.001, r * 1.55, r * 1.55 + 0.004, color)];
  }

  // The map replays the ten years by itself, on a fixed loop that the viewer cannot start, stop or steer.
  // It opens on the full picture (HOLD seconds), then adds the earthquakes year by year.
  const PLAY = { hold: 15, perYear: 4, meshes: [], threads: [], m7: [], state: '' };
  // rows are in time order, so "the first n" is always "everything up to this moment".
  const cumulative = rows => DATA.year_list.map(y => rows.filter(q => q[4] <= y).length);
  function showTime(seconds) {
    const years = DATA.year_list, t = seconds % (PLAY.hold + PLAY.perYear * years.length);
    const playing = t >= PLAY.hold;
    const yi = playing ? Math.min(years.length - 1, Math.floor((t - PLAY.hold) / PLAY.perYear)) : years.length - 1;
    const frac = playing ? (t - PLAY.hold) / PLAY.perYear - yi : 1;
    const upto = cum => Math.round((yi ? cum[yi - 1] : 0) + frac * (cum[yi] - (yi ? cum[yi - 1] : 0)));
    PLAY.meshes.forEach(function (m) { m.mesh.count = upto(m.cum); });
    PLAY.threads.forEach(function (t) { t.geometry.setDrawRange(0, upto(t.cum) * 2); });
    PLAY.m7.forEach(function (m) { m.object.visible = m.year <= years[yi]; });
    const state = playing ? String(years[yi]) : 'all';
    if (state === PLAY.state) return;
    PLAY.state = state;
    PLAY.year.setAttribute('value', playing ? state : years[0] + '-' + years[years.length - 1]);
    PLAY.sub.setAttribute('value', playing ? DATA.years[years[yi]] + ' earthquakes this year' : 'all ' + fmt(DATA.n) + ' earthquakes');
    PLAY.marker.visible = playing;
    PLAY.marker.position.x = PLAY.barX(yi);
  }

  // ---------------------------------------------------------------- the room: a floor to stand on
  function buildRoom(root) {
    rect(root, 0, 0, 0, 30, 30, COL.floor).rotation.x = -Math.PI / 2;
  }

  // ---------------------------------------------------------------- the block of ground: surface = map (Q1), inside = depth (Q2)
  // A see-through block of the Earth at waist height, like a geology block diagram. Its top is the map, drawn thin:
  // land as a pale film, the sea left open. Every earthquake is a ball at its own longitude, latitude and depth,
  // so a deep one hangs right under the place where it struck; intermediate and deep ones keep a thread up to it.
  // The reader looks down into the ground; moving the head makes the depth plain (parallax).
  function buildDiorama(root) {
    const a = -D_W / 2, b = D_W / 2, n = D_Z - D_D / 2, s = D_Z + D_D / 2, bot = LID - BOX_H, mid = LID - BOX_H / 2;
    const V = (x, y, z) => new THREE.Vector3(x, y, z);

    // The block: a pale floor and back, faint glass in front and at the sides, and its edges.
    rect(root, 0, bot, D_Z, D_W, D_D, '#E8EDF3').rotation.x = -Math.PI / 2;
    rect(root, 0, mid, n, D_W, BOX_H, '#EEF2F6');
    rect(root, 0, mid, s, D_W, BOX_H, '#DCE6F0', 0.08);
    [a, b].forEach(function (x) { rect(root, x, mid, D_Z, D_D, BOX_H, '#DCE6F0', 0.08).rotation.y = Math.PI / 2; });
    const edge = [];
    [[a, s], [b, s], [a, n], [b, n]].forEach(function (c) { edge.push(V(c[0], bot, c[1]), V(c[0], LID, c[1])); });
    [bot, LID].forEach(function (y) { edge.push(V(a, y, s), V(b, y, s), V(a, y, n), V(b, y, n), V(a, y, s), V(a, y, n), V(b, y, s), V(b, y, n)); });
    lines(root, edge, COL.line);

    // Depth scale round the back and sides, numbers outside the front-left edge; the deep band tinted on the back.
    const scale = [], d = DATA.deep_lon;
    [70, 300, 700].forEach(function (k) {
      const y = DY(k);
      scale.push(V(a, y, n + 0.002), V(b, y, n + 0.002), V(a + 0.002, y, n), V(a + 0.002, y, s), V(b - 0.002, y, n), V(b - 0.002, y, s));
      label(root, k + ' km', a - 0.03, y, s, T.label, { align: 'right', color: COL.muted });
    });
    lines(root, scale, COL.faint);
    rect(root, (DX(d[0]) + DX(d[1])) / 2, (DY(300) + DY(MAX_DEPTH)) / 2, n + 0.001, DX(d[1]) - DX(d[0]), DY(300) - DY(MAX_DEPTH), COL.s, 0.12);

    // The surface: a thin film of land, the coastline, a 5 degree graticule. Its own x is east, y north, z up.
    const F = child(root, '0 ' + LID + ' ' + D_Z, '-90 0 0');
    const shapes = DATA.land.map(p => new THREE.Shape(p.map(q => new THREE.Vector2(DX(q[0]), DN(q[1])))));
    F.object3D.add(new THREE.Mesh(new THREE.ShapeGeometry(shapes),
      new THREE.MeshBasicMaterial({ color: COL.land, transparent: true, opacity: 0.55, depthWrite: false, side: THREE.DoubleSide })));
    const W = (lon, lat, h) => V(DX(lon), DN(lat), h), shore = [], grid = [];
    DATA.coast.forEach(function (run) { for (let i = 1; i < run.length; i++) shore.push(W(run[i - 1][0], run[i - 1][1], 0.001), W(run[i][0], run[i][1], 0.001)); });
    lines(F, shore, '#7F93A8');
    for (let lon = 95; lon <= 150; lon += 5) grid.push(W(lon, -14, 0), W(lon, 9, 0));
    for (let lat = -10; lat <= 5; lat += 5) grid.push(W(92, lat, 0), W(152, lat, 0));
    lines(F, grid, COL.faint);
    // The area the earthquakes were taken from, 95-141 E, 11 S-6 N, as a dashed outline.
    const bx = DATA.box;
    lines(F, [W(bx[0], bx[2], 0.002), W(bx[1], bx[2], 0.002), W(bx[1], bx[2], 0.002), W(bx[1], bx[3], 0.002),
              W(bx[1], bx[3], 0.002), W(bx[0], bx[3], 0.002), W(bx[0], bx[3], 0.002), W(bx[0], bx[2], 0.002)], COL.muted, true);
    // M7+ marked where they struck, a ring on the surface.
    DATA.m7.forEach(function (e) {
      const r = ring(F, DX(e.lon), DN(e.lat), 0.003, 0.028, 0.034, COL[e.cls]);
      PLAY.m7.push({ object: r, year: e.year });
    });
    const ell = new THREE.EllipseCurve(DX(124.05), DN(0.62), 3.05 * SD, 1.32 * SD).getPoints(64), seg = [];
    for (let i = 1; i < ell.length; i++) seg.push(V(ell[i - 1].x, ell[i - 1].y, 0.004), V(ell[i].x, ell[i].y, 0.004));
    lines(F, seg, COL.cluster, true);

    // Every earthquake as a ball at its place and depth; threads from the deeper ones up to where they struck.
    PLAY.meshes.push({ mesh: discs(root, DATA.quakes.map(q => ({ x: DX(q[0]), y: DY(q[2]), z: DZ(q[1]), r: 0.006 + (q[3] - 5) * 0.004, color: COL[depthClass(q[2])] })), true),
                       cum: cumulative(DATA.quakes) });
    const deeper = DATA.quakes.filter(q => q[2] > 70), pos = [], colour = [], c = new THREE.Color();
    deeper.forEach(function (q) {
      c.set(COL[depthClass(q[2])]);
      pos.push(DX(q[0]), LID, DZ(q[1]), DX(q[0]), DY(q[2]), DZ(q[1]));
      colour.push(c.r, c.g, c.b, c.r, c.g, c.b);
    });
    const tg = new THREE.BufferGeometry();
    tg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    tg.setAttribute('color', new THREE.Float32BufferAttribute(colour, 3));
    root.object3D.add(new THREE.LineSegments(tg, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.35 })));
    PLAY.threads.push({ geometry: tg, cum: cumulative(deeper) });

    // Place names lie on the surface, each where it covers the fewest epicentres and no other name.
    const EM = 0.06, taken = [];
    [['SUMATRA', 101, -0.5], ['BORNEO', 114, -0.5], ['SULAWESI', 121, -2.5], ['PAPUA', 138, -4.6],
     ['JAVA', 110, -7.3], ['BANDA SEA', 127, -5.5]].forEach(function (p) {
      const w = p[0].length * EM * CH + 0.03, h = EM + 0.02;
      let best = null;
      for (let dx = -3; dx <= 3; dx += 0.5) for (let dy = -2; dy <= 2; dy += 0.5) {
        const x = DX(p[1] + dx), y = DN(p[2] + dy);
        if (x - w / 2 < a || x + w / 2 > b || y - h / 2 < -D_D / 2 || y + h / 2 > D_D / 2) continue;
        let cost = Math.hypot(dx, dy);
        DATA.quakes.forEach(function (q) { if (Math.abs(DX(q[0]) - x) < w / 2 && Math.abs(DN(q[1]) - y) < h / 2) cost += 10; });
        taken.forEach(function (t) { if (Math.abs(t.x - x) < (t.w + w) / 2 && Math.abs(t.y - y) < h) cost += 1000; });
        if (!best || cost < best.cost) best = { x: x, y: y, cost: cost };
      }
      taken.push({ x: best.x, y: best.y, w: w });
      label(F, p[0], best.x, best.y, 0.005, EM, { color: COL.ink });
    });
  }

  // ---------------------------------------------------------------- the words: free-standing captions, apart from the charts
  // A caption is the question in a word or two, its answer as one big number, and two or three lines that say what it means.
  function caption(P, x, top, num, title, big, bigColor, text) {
    label(P, title, x, top, 0.002, T.title, { align: 'left', baseline: 'top' });
    label(P, big, x, top - 0.13, 0.002, 0.2, { align: 'left', baseline: 'top', color: bigColor });
    const ls = wrap(text, 32);
    label(P, ls.join('\n'), x, top - 0.36, 0.002, T.sub, { align: 'left', baseline: 'top', color: COL.ink });
  }
  // A group standing at (x, z), turned to face home.
  function facingHome(root, x, z) {
    return child(root, x + ' 0 ' + z, '0 ' + (-Math.atan2(x, -z) / DEG) + ' 0');
  }

  function buildCaptions(root) {
    const top = DATA.regions[0], next = DATA.regions[1], cc = DATA.class_counts, d = DATA.deep_lon;
    caption(facingHome(root, -1.8, -1.26), -0.45, 1.7, '1', 'WHERE', Math.round(100 * top.total / DATA.n) + '%', COL.s,
            'of the strong earthquakes hit the ' + top.name + ': ' + top.total + ' of ' + fmt(DATA.n) + '. Next is ' + next.name + ', ' + Math.round(100 * next.total / DATA.n) + '%.');
    caption(facingHome(root, 1.8, -1.26), -0.45, 1.7, '2', 'HOW DEEP', Math.round(100 * cc.d / DATA.n) + '%', COL.d,
            'were deeper than 300 km (' + cc.d + '), all under ' + Math.floor(d[0]) + '-' + Math.ceil(d[1]) + ' E: look down into the block.');

    // Title and key float above the far side of the box.
    const P = child(root, '0 0 -2.9');
    label(P, 'Strong earthquakes (M5+) in and around Indonesia', 0, 1.74, 0, T.title, { baseline: 'top' });
    PLAY.year = label(P, '2016-2025', -0.55, 1.61, 0, T.sub, { align: 'right', baseline: 'top' });
    PLAY.sub = label(P, 'all ' + fmt(DATA.n) + ' earthquakes', -0.45, 1.61, 0, T.sub, { align: 'left', baseline: 'top', color: COL.muted });
    const key = [['s', 'Shallow 0-70 km'], ['i', 'Intermediate 70-300 km'], ['d', 'Deep over 300 km']];
    let x = -1.25;
    key.forEach(function (c) {
      discs(P, [{ x: x + 0.02, y: 1.45, z: 0.002, r: 0.022, color: COL[c[0]] }]);
      label(P, c[1], x + 0.06, 1.45, 0, T.label, { align: 'left' });
      x += 0.12 + c[1].length * T.label * CH;
    });
    [5, 6].forEach(function (m) {
      discs(P, [{ x: x + 0.02, y: 1.45, z: 0.002, r: dotSize(m) * 2, color: COL.muted }]);
      label(P, 'M' + m, x + 0.05, 1.45, 0, T.label, { align: 'left' });
      x += 0.2;
    });
    m7Symbol(P, x + 0.02, 1.45, 0.002, dotSize(7.3) * 2, COL.muted);
    label(P, 'M7+', x + 0.07, 1.45, 0, T.label, { align: 'left' });
    label(P, 'Each ball is one earthquake, under the place it struck, at its depth.   Bigger ball = stronger.', 0, 1.35, 0, T.label, { color: COL.muted });
  }

  // A solid bar: a box w x h x depth, its bottom-left-front corner logic left to the caller (centre given).
  function block(parent, x, y, z, w, h, depth, color) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, depth), new THREE.MeshLambertMaterial({ color: color }));
    m.position.set(x, y, z);
    parent.object3D.add(m);
    return m;
  }

  // ---------------------------------------------------------------- stop 3, left: one column per year (Q3)
  // Seen from stop 3 facing west. Each column is the year's earthquakes; its red foot is the top region's share.
  function buildYears(root) {
    const L = child(root, '-3.4 0 0', '0 90 0');   // its own x runs left to right for the reader at stop 3
    const years = DATA.year_list, totals = years.map(y => DATA.years[y]), reg = DATA.regions[0];
    const order = totals.map((v, i) => i).sort((p, q) => totals[q] - totals[p]), peak = order[0];
    const mean = DATA.n / years.length, regMean = reg.total / years.length;
    const BX = i => (i - 4.5) * 0.27, base = 0.4, k = 1.3 / Math.max.apply(null, totals);
    block(L, 0, base / 2, 0, 2.9, base, 0.4, '#CBD3DD');
    totals.forEach(function (v, i) {
      const r = reg.years[i];
      block(L, BX(i), base + r * k / 2, 0, 0.17, r * k, 0.17, COL.i);
      block(L, BX(i), base + r * k + (v - r) * k / 2, 0, 0.17, (v - r) * k, 0.17, COL.bar);
      const hot = order.indexOf(i) < 2;
      label(L, String(v), BX(i), base + v * k + 0.06, 0.09, T.label, { color: hot ? COL.ink : COL.muted });
      label(L, String(years[i]), BX(i), base - 0.08, 0.21, T.label, { color: hot ? COL.ink : COL.muted });
    });
    lines(L, [new THREE.Vector3(BX(0) - 0.15, base + mean * k, 0.1), new THREE.Vector3(BX(9) + 0.15, base + mean * k, 0.1)], COL.ink, true);
    label(L, 'mean ' + Math.round(mean), BX(9) + 0.2, base + mean * k, 0.1, T.label, { align: 'left', color: COL.muted });
    // A small bar on the plinth under the year the box is replaying.
    PLAY.marker = rect(L, BX(0), base - 0.16, 0.205, 0.17, 0.025, COL.ink);
    PLAY.barX = BX;
    caption(L, -2.75, 2.0, '3', 'WHEN', '+' + Math.round(100 * (totals[peak] - mean) / mean) + '%', COL.ink,
            'in ' + years[peak] + ': ' + totals[peak] + ' earthquakes against a 10-year mean of ' + Math.round(mean) + '. In red, the ' + reg.name + ': ' + reg.years[peak] + ' that year against ' + Math.round(regMean) + ' usually.');
  }

  // ---------------------------------------------------------------- stop 4, right: one beam per M7+ (Q4)
  // Seen from stop 4 facing east. Each beam is how many M5+ followed within 100 km in 30 days; shallowest at the top.
  function buildAfter(root) {
    const R = child(root, '3.4 0 -0.35', '0 -90 0');
    const g = DATA.groups, most = Math.max.apply(null, DATA.m7.map(e => e.after)), LEN = 1.3, ROW = 0.085;
    let y = 1.75;
    DATA.m7.forEach(function (e, i) {
      if (i && DATA.m7[i - 1].cls !== e.cls) y -= ROW * 0.5;
      label(R, e.name + " '" + String(e.year).slice(2) + ' (' + e.depth + ' km)', -0.05, y, 0.04, T.label, { align: 'right' });
      const w = e.after / most * LEN;
      if (w > 0) block(R, w / 2, y, 0, w, ROW * 0.62, 0.06, COL[e.cls]);
      label(R, String(e.after), w + 0.04, y, 0.04, T.label, { align: 'left' });
      y -= ROW;
    });
    lines(R, [new THREE.Vector3(0, 1.75 + ROW / 2, 0.04), new THREE.Vector3(0, y + ROW / 2, 0.04)], COL.line);
    caption(R, LEN + 0.5, 2.0, '4', 'WHAT FOLLOWS', String(Math.round(10 * g.s.median_after / g.d.median_after) / 10) + 'x', COL.ink,
            'more M5+ within ' + DATA.near_km + ' km in the next ' + DATA.window_days + ' days after a shallow M7+ than after a deep one (median ' + g.s.median_after + ' vs ' + g.d.median_after + ').');
  }

  AFRAME.registerComponent('quake-room', {
    init: function () {
      buildRoom(this.el);
      buildDiorama(this.el);
      buildCaptions(this.el);
      buildYears(this.el);
      buildAfter(this.el);
      showTime(0);
    },
    tick: function (time) {
      // On a screen, start looking 25 deg down into the block; a headset ignores this and follows the head.
      if (!this.pitched) {
        const lc = document.querySelector('[look-controls]').components['look-controls'];
        if (lc && lc.pitchObject) {
          // Look down just far enough that the title stays at the top edge: half the vertical view, less 4 deg.
          const v = Math.max(35, Math.min(100, 2 * Math.atan(Math.tan(45 * DEG) * window.innerHeight / window.innerWidth) / DEG));
          lc.pitchObject.rotation.x = -Math.min(30, Math.max(15, v / 2 - 4)) * DEG;
          this.pitched = true;
        }
      }
      // On a screen, keep 90 deg across whatever the window's shape, so the whole block fits and fills it;
      // a camera's fov is vertical, so a narrow window would otherwise crop the sides. A headset uses its own.
      const aspect = window.innerWidth / window.innerHeight;
      if (aspect !== this.aspect) {
        this.aspect = aspect;
        const v = 2 * Math.atan(Math.tan(45 * DEG) / aspect) / DEG;
        document.querySelector('[camera]').setAttribute('camera', 'fov', Math.max(35, Math.min(100, v)));
      }
      showTime(time / 1000);
    }
  });
  </script>
</head>
<body>
  <a-scene background="color: #F7F8FA" renderer="colorManagement: true; antialias: true">

    <!-- HOME POSITION: the origin, eyes at 1.6 m, facing -Z (north), 1.3 m from the box. fov 58 is for the desktop view only; a headset uses its own. -->
    <a-entity id="home" position="0 0 0">
      <a-entity camera="fov: 58" look-controls="reverseMouseDrag: true" wasd-controls="acceleration: 20" position="0 1.6 0"></a-entity>
    </a-entity>

    <a-ring rotation="-90 0 0" position="0 0.01 0" radius-inner="0.25" radius-outer="0.3" color="#141A22"></a-ring>
    <a-text value="HOME" rotation="-90 0 0" position="0 0.012 0.45" align="center" width="2.4" color="#141A22"></a-text>

    <!-- Everything computed from the data. -->
    <a-entity quake-room></a-entity>
  </a-scene>
</body>
</html>
