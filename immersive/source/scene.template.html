<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group 05 · Immersive view · Earthquakes M5+ in Indonesia, 2016-2025</title>
  <!-- A-Frame. Opens in a phone or desktop browser; the goggles button enters VR on a headset. -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script>
  /*
    VIEW-ONLY scene for EA234506 Group Assignment 2, Group 05 (Kay's Family).
    Generated by build_scene.py: the DATA object below is computed from the USGS rows.

    The 2D dashboard, turned into a room. The viewer may move their own viewpoint and
    nothing else: everything is built once when the page loads and never changes.

    Units are metres. The viewer's eyes are at y = 1.6. They face -Z (north) at the start.

      floor        panel 1, the map, 6.9 m wide: a glass floor the viewer can walk on     Q1
      under it     panel 3, depth: every quake deeper than 70 km hangs below its place   Q2
      north wall   panels 2, 4 and 5, drawn as on the dashboard                          Q3, Q4, Q5
      on the map   the Deep viewpoint: stand over the Flores Sea and look down           Q2
  */
  const DATA = __DATA_JSON__;

  // The dashboard's palette: one red scale for depth, light to dark as the quake gets deeper.
  const COL = { s: '#F2988A', i: '#C9372C', d: '#4A1512', accent: '#D9382C',
                ink: '#141A22', muted: '#5F6B7A', line: '#9FB0C2', faint: '#D3DBE4',
                land: '#C9D6E3', floor: '#F4F6F9', pit: '#B9C5D2', pitFloor: '#A9B7C6',
                panel: '#FFFFFF', bar: '#BCC3CB', ghost: '#8E9BAA' };
  const CLASS_NAME = { s: 'Shallow', i: 'Intermediate', d: 'Deep' };
  const CLASS_RANGE = { s: '0-70 km', i: '70-300 km', d: 'over 300 km' };
  const MAX_DEPTH = 650;
  const LON_MID = 118, LAT_MID = -2.5;

  const depthClass = d => d <= 70 ? 's' : (d <= 300 ? 'i' : 'd');
  const fmt = n => n.toLocaleString('en-US');

  // The floor map: 0.15 m per degree, so the 46 by 17 degree box is 6.9 by 2.55 m.
  // Its south edge is 1.5 m in front of home.
  const S = 0.15, MAP_W = 46 * S, MAP_D = 17 * S, MAP_Z = -1.5 - MAP_D / 2, PIT = 2.0;
  const X = lon => (lon - LON_MID) * S;
  const N = lat => (lat - LAT_MID) * S;          // metres north of the map's middle
  const Z = lat => MAP_Z - N(lat);
  const DOWN = d => -d / MAX_DEPTH * PIT;        // 650 km hangs 2 m below the floor

  function child(parent, position, rotation) {
    const e = document.createElement('a-entity');
    e.setAttribute('position', position);
    if (rotation) e.setAttribute('rotation', rotation);
    parent.appendChild(e);
    return e;
  }

  // em is the letter height in metres, so text size is stated in the scene's own units.
  function label(parent, str, x, y, z, em, opt) {
    opt = opt || {};
    const t = document.createElement('a-text');
    const n = Math.max(40, str.length + 2);
    const align = opt.align || 'center';
    t.setAttribute('value', str);
    t.setAttribute('wrap-count', n);
    t.setAttribute('width', em * n * 0.5);
    t.setAttribute('align', align);
    t.setAttribute('anchor', align);
    t.setAttribute('baseline', opt.baseline || 'center');
    t.setAttribute('color', opt.color || COL.ink);
    t.setAttribute('position', x + ' ' + y + ' ' + z);
    if (opt.rotation) t.setAttribute('rotation', opt.rotation);
    parent.appendChild(t);
    return t;
  }

  function rect(parent, x, y, z, w, h, color, opacity) {
    const mat = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide });
    if (opacity !== undefined) { mat.transparent = true; mat.opacity = opacity; mat.depthWrite = false; }
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    m.position.set(x, y, z);
    parent.object3D.add(m);
    return m;
  }

  function lines(parent, points, color) {
    const g = new THREE.BufferGeometry().setFromPoints(points);
    const l = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: color }));
    parent.object3D.add(l);
    return l;
  }

  // marks: [{x, y, z, r, color}] drawn as one instanced mesh.
  const DISC = new THREE.CircleGeometry(1, 24);
  const BALL = new THREE.SphereGeometry(1, 12, 8);
  function marks(parent, items, geometry, opacity) {
    if (!items.length) return null;
    const mat = new THREE.MeshBasicMaterial({ transparent: opacity < 1, opacity: opacity, depthWrite: opacity === 1 });
    const mesh = new THREE.InstancedMesh(geometry, mat, items.length);
    const o = new THREE.Object3D();
    const c = new THREE.Color();
    items.forEach(function (it, i) {
      o.position.set(it.x, it.y, it.z);
      o.scale.setScalar(it.r);
      o.updateMatrix();
      mesh.setMatrixAt(i, o.matrix);
      mesh.setColorAt(i, c.set(it.color));
    });
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    mesh.frustumCulled = false;
    parent.object3D.add(mesh);
    return mesh;
  }
  const discs = (parent, items, opacity) => marks(parent, items, DISC, opacity === undefined ? 1 : opacity);

  function ring(parent, x, y, z, inner, outer, color, opacity) {
    const mat = new THREE.MeshBasicMaterial({ color: color, transparent: opacity < 1, opacity: opacity, depthWrite: false });
    const m = new THREE.Mesh(new THREE.RingGeometry(inner, outer, 48), mat);
    m.position.set(x, y, z);
    parent.object3D.add(m);
    return m;
  }

  const dotSize = m => 0.011 + (m - 5) * 0.02;

  // The map replays the ten years by itself, on a fixed loop that the viewer cannot start, stop or steer.
  // It opens on the full picture (HOLD seconds), then adds the earthquakes year by year.
  const PLAY = { hold: 15, perYear: 1.8, meshes: [], threads: [], m7: [], state: '' };
  // rows are in time order, so "the first n" is always "everything up to this moment".
  const cumulative = rows => DATA.year_list.map(y => rows.filter(q => q[4] <= y).length);
  function showTime(seconds) {
    const years = DATA.year_list, t = seconds % (PLAY.hold + PLAY.perYear * years.length);
    const playing = t >= PLAY.hold;
    const yi = playing ? Math.min(years.length - 1, Math.floor((t - PLAY.hold) / PLAY.perYear)) : years.length - 1;
    const frac = playing ? (t - PLAY.hold) / PLAY.perYear - yi : 1;
    const upto = cum => Math.round((yi ? cum[yi - 1] : 0) + frac * (cum[yi] - (yi ? cum[yi - 1] : 0)));
    PLAY.meshes.forEach(function (m) { m.mesh.count = upto(m.cum); });
    PLAY.threads.forEach(function (m) { m.geometry.setDrawRange(0, upto(m.cum) * 2); });
    PLAY.m7.forEach(function (m) { m.object.visible = m.year <= years[yi]; });
    const state = playing ? String(years[yi]) : 'all';
    if (state === PLAY.state) return;
    PLAY.state = state;
    PLAY.year.setAttribute('value', playing ? state : years[0] + '-' + years[years.length - 1]);
    PLAY.sub.setAttribute('value', playing ? DATA.years[years[yi]] + ' earthquakes this year' : 'all ' + fmt(DATA.n) + ' earthquakes');
    PLAY.marker.visible = playing;
    PLAY.marker.position.x = PLAY.barX(yi);
  }

  // ---------------------------------------------------------------- the room: floor, and the pit under the map
  function buildRoom(root) {
    const a = -MAP_W / 2, b = MAP_W / 2, n = MAP_Z - MAP_D / 2, s = MAP_Z + MAP_D / 2, BIG = 30;
    const flat = function (x, z, w, d, y, color) { const m = rect(root, x, y, z, w, d, color); m.rotation.x = -Math.PI / 2; };
    // Solid floor everywhere except over the map.
    flat(0, s + BIG / 2, BIG * 2, BIG, 0, COL.floor);
    flat(0, n - BIG / 2, BIG * 2, BIG, 0, COL.floor);
    flat(a - BIG / 2, MAP_Z, BIG, MAP_D, 0, COL.floor);
    flat(b + BIG / 2, MAP_Z, BIG, MAP_D, 0, COL.floor);
    // The pit: four walls and a bottom, with the depth scale drawn round the walls.
    flat(0, MAP_Z, MAP_W, MAP_D, -PIT - 0.06, COL.pitFloor);
    rect(root, 0, -PIT / 2 - 0.03, n, MAP_W, PIT + 0.06, COL.pit);
    rect(root, 0, -PIT / 2 - 0.03, s, MAP_W, PIT + 0.06, COL.pit);
    rect(root, a, -PIT / 2 - 0.03, MAP_Z, MAP_D, PIT + 0.06, COL.pit).rotation.y = Math.PI / 2;
    rect(root, b, -PIT / 2 - 0.03, MAP_Z, MAP_D, PIT + 0.06, COL.pit).rotation.y = Math.PI / 2;
    const V = (x, y, z) => new THREE.Vector3(x, y, z);
    const e = 0.004, scale = [];
    [70, 300, 650].forEach(function (d) {
      const y = DOWN(d);
      scale.push(V(a, y, n + e), V(b, y, n + e), V(a + e, y, n), V(a + e, y, s), V(b - e, y, n), V(b - e, y, s));
      [-2.3, 0, 2.3].forEach(function (x) {
        label(root, d + ' km deep', x, y + 0.09, n + 0.01, 0.11, { color: COL.ink });
      });
    });
    lines(root, scale, COL.line);
  }

  // ---------------------------------------------------------------- panel 1: the map on the glass floor (Q1)
  function buildMap(root) {
    // The map lies flat: its own x is east, its own y is north, its own z is up.
    const F = child(root, '0 0 ' + MAP_Z, '-90 0 0');
    const V = (lon, lat, h) => new THREE.Vector3(X(lon), N(lat), h);

    // Land, as a light sheet the viewer can still see through.
    const shapes = DATA.land.map(p => new THREE.Shape(p.map(q => new THREE.Vector2(X(q[0]), N(q[1])))));
    const land = new THREE.Mesh(new THREE.ShapeGeometry(shapes),
      new THREE.MeshBasicMaterial({ color: '#E4EBF2', transparent: true, opacity: 0.78, depthWrite: false, side: THREE.DoubleSide }));
    land.position.z = 0.002;
    F.object3D.add(land);
    const shore = [];
    DATA.coast.forEach(function (run) {
      for (let i = 1; i < run.length; i++) shore.push(V(run[i - 1][0], run[i - 1][1], 0.004), V(run[i][0], run[i][1], 0.004));
    });
    lines(F, shore, COL.line);

    // The dashboard's graticule: it also makes the glass visible as a surface to stand on.
    const grid = [];
    for (let lon = 95; lon <= 140; lon += 5) {
      grid.push(V(lon, -11, 0.003), V(lon, 6, 0.003));
      label(F, lon + ' E', X(lon), -MAP_D / 2 - 0.09, 0.004, 0.06, { color: COL.muted });
    }
    [-10, -5, 0, 5].forEach(function (lat) {
      grid.push(V(95, lat, 0.003), V(141, lat, 0.003));
      label(F, lat === 0 ? 'Equator' : Math.abs(lat) + (lat < 0 ? ' S' : ' N'), -MAP_W / 2 - 0.06, N(lat), 0.004, 0.06, { align: 'right', color: COL.muted });
    });
    grid.push(V(95, -11, 0.003), V(141, -11, 0.003), V(95, 6, 0.003), V(141, 6, 0.003), V(141, -11, 0.003), V(141, 6, 0.003));
    lines(F, grid, COL.faint);

    [['SUMATRA', 101.6, -0.8], ['BORNEO', 113.8, -1.9], ['SULAWESI', 121.2, -2.6], ['PAPUA', 137.6, -4.4],
     ['JAVA', 110.6, -7.4], ['BANDA SEA', 128.5, -6.2], ['MOLUCCA SEA', 126, 1.6]].forEach(function (p) {
      label(F, p[0], X(p[1]), N(p[2]), 0.005, 0.075, { color: COL.muted });
    });

    // One dot per earthquake where it struck: colour = depth class, size = magnitude.
    const small = DATA.quakes.filter(q => q[3] < 7);
    const dots = small.map(q => ({ x: X(q[0]), y: N(q[1]), z: 0.008, r: dotSize(q[3]), color: COL[depthClass(q[2])] }));
    // A pale print of every earthquake stays down all the time, so "where" is readable at any moment of the replay.
    discs(F, dots.map(d => ({ x: d.x, y: d.y, z: 0.006, r: d.r, color: COL.ghost })), 0.45);
    PLAY.meshes.push({ mesh: discs(F, dots, 0.9), cum: cumulative(small) });

    // The year the replay has reached, written over Borneo, where almost no earthquake falls.
    PLAY.year = label(F, '', X(113.6), N(1.7), 0.005, 0.3, { color: COL.ink });
    PLAY.sub = label(F, '', X(113.6), N(0.2), 0.005, 0.085, { color: COL.muted });

    // The fifteen M7+ earthquakes: a bullseye, and two still rings like the wave spreading from it.
    DATA.m7.forEach(function (e) {
      const x = X(e.lon), y = N(e.lat), r0 = 0.05;
      const parts = [1.9, 2.8].map(function (k, i) { return ring(F, x, y, 0.009, r0 * k - 0.004, r0 * k + 0.004, COL.accent, 0.8 - i * 0.3); });
      parts.push(ring(F, x, y, 0.011, r0 * 0.62, r0, COL.accent, 1));
      parts.push(discs(F, [{ x: x, y: y, z: 0.010, r: r0 * 0.62, color: '#FFFFFF' }, { x: x, y: y, z: 0.012, r: r0 * 0.36, color: COL[e.cls] }]));
      parts.forEach(function (o) { PLAY.m7.push({ object: o, year: e.year }); });
    });

    // A name flag for the two strongest, the same two the dashboard labels.
    const posts = [];
    DATA.m7.slice().sort((p, q) => q.mag - p.mag).slice(0, 2).forEach(function (e) {
      const x = X(e.lon), z = Z(e.lat), h = 0.45;
      posts.push(new THREE.Vector3(x, 0, z), new THREE.Vector3(x, h, z));
      rect(root, x, h + 0.085, z - 0.004, 0.8, 0.2, '#FFFFFF');
      label(root, 'M' + e.mag.toFixed(1) + ' ' + e.name + ' (' + e.year + ')', x, h + 0.125, z, 0.06);
      label(root, 'Depth ' + e.depth + ' km (' + CLASS_NAME[e.cls] + ')', x, h + 0.04, z, 0.048, { color: COL.muted });
    });
    lines(root, posts, COL.accent);
  }

  // ---------------------------------------------------------------- panel 3: depth, hanging under the glass (Q2)
  function buildDepth(root) {
    const roots = [], beads = [];
    const below = DATA.quakes.filter(q => q[2] > 70);   // shallow ones stay on the map: 70 km is only 0.2 m here
    below.forEach(function (q) {
      const x = X(q[0]), z = Z(q[1]), y = DOWN(q[2]), c = COL[depthClass(q[2])];
      roots.push({ a: new THREE.Vector3(x, 0, z), b: new THREE.Vector3(x, y, z), c: c });
      beads.push({ x: x, y: y, z: z, r: dotSize(q[3]) * 1.1, color: c });
    });
    const col = new THREE.Color(), pos = [], colour = [];
    roots.forEach(function (r) {
      col.set(r.c);
      pos.push(r.a.x, r.a.y, r.a.z, r.b.x, r.b.y, r.b.z);
      colour.push(col.r, col.g, col.b, col.r, col.g, col.b);
    });
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(colour, 3));
    root.object3D.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.4 })));
    PLAY.threads.push({ geometry: g, cum: cumulative(below) });
    PLAY.meshes.push({ mesh: marks(root, beads, BALL, 1), cum: cumulative(below) });
  }

  // ---------------------------------------------------------------- the words on the floor, between home and the map
  function buildCaptions(root) {
    const z0 = MAP_Z + MAP_D / 2;
    const C = child(root, '0 0.006 ' + (z0 + 0.62), '-90 0 0');
    const top = DATA.regions[0], d = DATA.deep_lon;
    label(C, '1. Most strong earthquakes hit eastern Indonesia, around the Molucca Sea: ' + top.total + ' of ' + fmt(DATA.n) + '.', 0, 0.3, 0, 0.085);
    label(C, '3. Deep earthquakes sit only under the middle of Indonesia, between ' + Math.floor(d[0]) + ' E and ' + Math.ceil(d[1]) + ' E. Walk onto the glass and look down.',
          0, 0.16, 0, 0.085);
    const legend = ['s', 'i', 'd'].map(c => ({ color: COL[c], text: CLASS_NAME[c] + ' ' + CLASS_RANGE[c] + ' (' + fmt(DATA.class_counts[c]) + ')' }));
    const EM = 0.07, GAP = 0.2, widths = legend.map(l => 0.11 + l.text.length * EM * 0.5);
    const tail = 'Bigger dot = stronger. Rings = magnitude 7+. Longer thread = deeper.';
    let x = -(widths.reduce((p, c) => p + c, 0) + GAP * (legend.length - 1)) / 2;
    legend.forEach(function (l, i) {
      discs(C, [{ x: x + 0.04, y: 0, z: 0.002, r: 0.04, color: l.color }]);
      label(C, l.text, x + 0.11, 0, 0, EM, { align: 'left' });
      x += widths[i] + GAP;
    });
    label(C, tail + ' The map replays 2016 to 2025 by itself.', 0, -0.14, 0, EM, { color: COL.muted });
  }

  // ---------------------------------------------------------------- the north wall: panels 2, 4 and 5
  function panel(root, x, title, title2, sub) {
    const z = MAP_Z - MAP_D / 2 - 0.9;
    const P = child(root, x + ' 0 ' + z, '0 ' + (-Math.atan2(x, -z) * 180 / Math.PI) + ' 0');
    rect(P, 0, 1.65, -0.006, 3.0, 2.5, COL.panel);
    label(P, title, -1.38, 2.72, 0, 0.115, { align: 'left' });
    if (title2) label(P, title2, -1.38, 2.58, 0, 0.115, { align: 'left' });
    label(P, sub, -1.38, title2 ? 2.44 : 2.57, 0, 0.07, { align: 'left', color: COL.muted });
    return P;
  }

  function buildYears(root) {
    const years = DATA.year_list, totals = years.map(y => DATA.years[y]);
    const order = totals.map((v, i) => i).sort((p, q) => totals[q] - totals[p]);
    const hot = order.slice(0, 2);
    const mean = r => r.years.reduce((p, c) => p + c, 0) / r.years.length;
    const driver = i => DATA.regions.slice().sort((p, q) => (q.years[i] - mean(q)) - (p.years[i] - mean(p)))[0];
    const d0 = driver(hot[0]);
    const P = panel(root, -3.25, '2. ' + years[hot[0]] + ' and ' + years[hot[1]] + ' were the busiest years.', null,
                    d0.name + ' made ' + years[hot[0]] + ' high: ' + d0.years[hot[0]] + ', against ' + Math.round(mean(d0)) + ' in an average year.');
    const BX = i => -1.12 + i * 0.25, base = 0.75, k = 1.3 / Math.max.apply(null, totals);
    lines(P, [new THREE.Vector3(BX(0) - 0.14, base, 0.002), new THREE.Vector3(BX(9) + 0.14, base, 0.002)], COL.line);
    totals.forEach(function (v, i) {
      const on = hot.indexOf(i) >= 0;
      rect(P, BX(i), base + v * k / 2, 0.002, 0.19, v * k, on ? COL.accent : COL.bar);
      label(P, String(v), BX(i), base + v * k + 0.07, 0, 0.08, { color: on ? COL.accent : COL.muted });
      label(P, "'" + String(years[i]).slice(2), BX(i), base - 0.09, 0, 0.08, { color: on ? COL.ink : COL.muted });
    });
    // A small bar under the year that the floor map is replaying.
    PLAY.marker = rect(P, BX(0), base - 0.18, 0.002, 0.19, 0.035, COL.ink);
    PLAY.barX = BX;
  }

  function buildStrength(root) {
    const g = DATA.groups;
    const P = panel(root, 0, '4. Strong earthquakes can be shallow or deep.', null,
                    'Of the ' + DATA.m7.length + ' of magnitude 7+: ' + g.s.n + ' shallow, ' + g.i.n + ' intermediate, ' + g.d.n + ' deep.');
    const PX = d => -1.1 + d / MAX_DEPTH * 2.3, PY = m => 0.8 + (m - 5) / 2.7 * 1.5;
    const V = (x, y) => new THREE.Vector3(x, y, 0.002);
    lines(P, [V(PX(0), PY(5)), V(PX(650), PY(5)), V(PX(0), PY(5)), V(PX(0), PY(7.7))], COL.line);
    lines(P, [V(PX(0), PY(7)), V(PX(650), PY(7)), V(PX(70), PY(5)), V(PX(70), PY(7.7)), V(PX(300), PY(5)), V(PX(300), PY(7.7))], COL.faint);
    [[0, '0'], [70, '70'], [300, '300'], [650, '650 km deep']].forEach(function (t) { label(P, t[1], PX(t[0]), PY(5) - 0.09, 0, 0.07, { color: COL.muted, align: t[0] === 650 ? 'right' : 'center' }); });
    [5, 6, 7].forEach(function (m) { label(P, 'M' + m, PX(0) - 0.05, PY(m), 0, 0.07, { align: 'right', color: COL.muted }); });
    discs(P, DATA.quakes.filter(q => q[3] < 7).map(q => ({ x: PX(q[2]), y: PY(q[3]), z: 0.004, r: 0.022, color: COL[depthClass(q[2])] })), 0.7);
    DATA.m7.forEach(function (e) {
      ring(P, PX(e.depth), PY(e.mag), 0.006, 0.03, 0.045, COL.accent, 1);
      discs(P, [{ x: PX(e.depth), y: PY(e.mag), z: 0.005, r: 0.03, color: '#FFFFFF' }, { x: PX(e.depth), y: PY(e.mag), z: 0.007, r: 0.018, color: COL[e.cls] }]);
    });
  }

  function buildAfter(root) {
    const P = panel(root, 3.25, '5. Shallow big earthquakes are often followed', 'by more; deep ones are not.',
                    'M5+ within ' + DATA.near_km + ' km in the next ' + DATA.window_days + ' days, after each M7+. Shallowest at the top.');
    const most = Math.max.apply(null, DATA.m7.map(e => e.after)), X0 = -0.2, LEN = 1.3, ROW = 0.108;
    let y = 2.2;
    DATA.m7.forEach(function (e, i) {
      if (i && DATA.m7[i - 1].cls !== e.cls) y -= ROW * 0.35;
      label(P, e.name + " '" + String(e.year).slice(2) + ' (' + e.depth + ' km)', X0 - 0.05, y, 0, 0.065, { align: 'right' });
      const w = e.after / most * LEN;
      if (w > 0) rect(P, X0 + w / 2, y, 0.002, w, ROW * 0.62, COL[e.cls]);
      label(P, String(e.after), X0 + w + 0.04, y, 0, 0.07, { align: 'left' });
      y -= ROW;
    });
    lines(P, [new THREE.Vector3(X0, 2.27, 0.004), new THREE.Vector3(X0, y + ROW * 0.6, 0.004)], COL.line);
  }

  AFRAME.registerComponent('quake-room', {
    init: function () {
      buildRoom(this.el);
      buildMap(this.el);
      buildDepth(this.el);
      buildCaptions(this.el);
      buildYears(this.el);
      buildStrength(this.el);
      buildAfter(this.el);
      showTime(0);
    },
    tick: function (time) { showTime(time / 1000); }
  });
  </script>
</head>
<body>
  <a-scene background="color: #F7F8FA" renderer="colorManagement: true; antialias: true">

    <!-- HOME POSITION: the origin, eyes at 1.6 m, facing -Z (north), just south of the map's edge. -->
    <a-entity id="home" position="0 0 0">
      <a-entity camera="fov: 70" look-controls="reverseMouseDrag: true" wasd-controls="acceleration: 20" position="0 1.6 0"></a-entity>
    </a-entity>

    <!-- Home marker, and the one named viewpoint: on the glass over the Flores Sea, looking down. -->
    <a-ring rotation="-90 0 0" position="0 0.01 0" radius-inner="0.25" radius-outer="0.3" color="#141A22"></a-ring>
    <a-text value="HOME" rotation="-90 0 0" position="0 0.012 0.45" align="center" width="2.4" color="#141A22"></a-text>
    <a-ring rotation="-90 0 0" position="0 0.014 -2.2" radius-inner="0.2" radius-outer="0.215" color="#141A22"></a-ring>
    <a-text value="DEEP VIEWPOINT: look down" rotation="-90 0 0" position="0 0.016 -1.93" align="center" width="1.3" color="#141A22"></a-text>

    <!-- Everything computed from the data. -->
    <a-entity quake-room></a-entity>
  </a-scene>
</body>
